<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="Multimodal document intelligence: hybrid BM25 + FAISS retrieval, reranking and cited answers over PDFs, scans, tables and charts.">
  <title>{% block title %}DocIntel{% endblock %} · Document Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="{{ active }}">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('pages.ask_page') }}">
        <span class="brand-mark" aria-hidden="true">DI</span>
        <span>DocIntel</span>
      </a>
      <nav aria-label="Primary">
        <a href="{{ url_for('pages.ask_page') }}" {% if active == 'ask' %}aria-current="page"{% endif %}>Ask</a>
        <a href="{{ url_for('pages.documents_page') }}" {% if active == 'documents' %}aria-current="page"{% endif %}>Documents</a>
        <a href="{{ url_for('pages.evaluate_page') }}" {% if active == 'evaluate' %}aria-current="page"{% endif %}>Evaluate</a>
      </nav>
      <div class="status-pill" id="status-pill" aria-live="polite">Loading…</div>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
